name: 작업 지시서
description: 에이전트에게 맡길 작업 하나
title: "[작업] "
body:
  - type: markdown
    attributes:
      value: |
        **에이전트를 띄울 때 이 문장을 그대로 쓰세요:** `AGENTS.md를 읽고 Issue #N을 수행하라.`

        핵심 규칙: 브랜치명은 `<에이전트>/<이슈번호>-슬러그`, 아래 수정 가능 경로 밖은 건드리지 않기, PR에는 실행한 명령과 실제 출력을 붙이기.
  - type: dropdown
    id: type
    attributes:
      label: 종류
      options:
        - feature
        - refactor
        - fix
        - docs
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: 규모 (한 세션 안에 끝나는 크기. L이면 쪼개기)
      options:
        - S
        - M
        - L
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표 (이 Issue만 읽고 작업할 수 있게)
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: 수정 가능 경로 (한 줄에 경로 하나)
      placeholder: "projects/example/"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건 (참/거짓으로 판정 가능하게)
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: 검증 방법 (실행할 명령과 기대 결과)
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: 선행 작업 (선택)
      placeholder: "#12"
  - type: textarea
    id: budget
    attributes:
      label: 예산 메모 (선택)
